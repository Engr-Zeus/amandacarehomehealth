<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amanda.com Hero Recreation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./assets/images/favico.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/style.css">
    <style>
        .bg-care-hero {
            background-image: url('./assets/images/hero-greatercare-large2.jpeg');
            background-size: cover;
            background-position: center;
            color: white;
        }
    </style>
</head>

<body class="overflow-x-hidden">
    <!-- PAGE WRAPPER: Selection Phase -->
    <div class="min-h-screen bg-[#F8F6F0] flex flex-col justify-between font-sans text-slate-900">

        <!-- Top Navigation Bar -->
        <header class="bg-white py-6 px-6 md:px-12 getting-started-header">
            <div class="max-w-7xl mx-auto flex items-center">
                <a href="#" class="flex items-center gap-2">
                    <img src="./assets/images/logo-two.png" alt="logo" class="h-8 md:h-10">
                </a>
            </div>
        </header>

        <!-- Main Content Container -->
        <main class="flex-1 flex flex-col items-center justify-center px-4 pb-12">

            <!-- Heading -->
            <h1 class="text-2xl sm:text-2xl md:text-3xl text-center text-slate-900 mb-10 tracking-tight">
                Let's get started. Choose an option:
            </h1>

            <!-- Cards Container -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 max-w-2xl w-full">

                <!-- Card 1: I need a caregiver -->
                <div
                    class="bg-white rounded-[32px] p-8 md:p-10 shadow-xs flex flex-col items-start justify-between min-h-[260px] hover:shadow-md transition-shadow">
                    <div class="space-y-2 w-full">
                        <!-- Illustration Placeholder -->
                        <div class="w-18 h-18 mb-4">
                            <img src="./assets/images/need-caregiver-icon.png" alt="I need a caregiver"
                                class="w-full h-full object-contain">
                        </div>

                        <h2 class="text-2xl font-bold text-slate-900">
                            I need a caregiver
                        </h2>

                        <p class="text-slate-600 text-base leading-relaxed">
                            Start your free search for care in your area.
                        </p>
                    </div>

                    <!-- Action Button -->
                    <div class="pt-4 w-full">
                        <a href="#"
                            class="inline-block bg-[#0E5244] text-[#D2F5A5] font-semibold text-center py-2 px-8 rounded-full hover:bg-[#0A3F34] transition-colors w-full sm:w-auto">
                            Find care
                        </a>
                    </div>
                </div>

                <!-- Card 2: I want a care job -->
                <div
                    class="bg-white rounded-[32px] p-8 md:p-10 shadow-xs flex flex-col items-start justify-between min-h-[260px] hover:shadow-md transition-shadow">
                    <div class="space-y-2 w-full">
                        <!-- Illustration Placeholder -->
                        <div class="w-18 h-18 mb-4">
                            <img src="./assets/images/need-caregiver-icon.png" alt="I need a caregiver"
                                class="w-full h-full object-contain">
                        </div>

                        <h2 class="text-2xl font-bold text-slate-900">
                            I want a care job
                        </h2>

                        <p class="text-slate-600 text-base leading-relaxed">
                            Create a profile and search for jobs
                        </p>
                    </div>

                    <!-- Action Button -->
                    <div class="pt-4 w-full">
                        <a href="#"
                            class="inline-block bg-[#0E5244] text-[#D2F5A5] font-semibold text-center py-2 px-8 rounded-full hover:bg-[#0A3F34] transition-colors w-full sm:w-auto">
                            Find care
                        </a>
                    </div>
                </div>

            </div>

        </main>

        <!-- Empty Footer Spacer for Centering Alignment -->
        <footer class="py-4"></footer>

    </div>
</body>

</html>
